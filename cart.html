<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Heavens Party Treats</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h3 style="color:#d900ff">Heavens Party Treats</h3>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
        <h2>Your Shopping Cart</h2>

        <!-- Table displaying cart items -->
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="border-bottom: 2px solid #ddd; text-align: left;">
                    <th style="padding: 10px;">Item</th>
                    <th style="padding: 10px;">Price</th>
                    <th style="padding: 10px;">Quantity</th>
                    <th style="padding: 10px;">Subtotal</th>
                    <th style="padding: 10px;">Action</th>
                </tr>
            </thead>
            <tbody id="cart-table-body">
                <!-- Cart items populate here -->
            </tbody>
        </table>

        <!-- Total Price & Checkout -->
        <div style="text-align: right; margin-top: 30px;">
            <h3>Total: £<span id="cart-total">0.00</span></h3>
            <button onclick="checkout()" style="padding: 12px 24px; background-color: #d900ff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                Proceed to Checkout
            </button>
        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
